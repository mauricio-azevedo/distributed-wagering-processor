name: Bug report
description: Report incorrect or unexpected behavior.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the minimum setup and steps needed.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, commit, and configuration.

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Include relevant errors, logs, screenshots, or failing tests.
