name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt, lint, typecheck, audit and the image build: no container needed (ops.parallel-gate, ADR 0016).
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: make fmt-check
      - run: make lint
      - run: make typecheck
      - run: make audit
      - run: make build

  # test/unit and test/contract: under two seconds of test time, but test/contract still needs
  # PostgreSQL (http-contract.test.ts migrates and boots the application against it).
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: make test TESTS="test/unit test/contract"
      - if: failure()
        run: docker compose logs

  # test/integration, sharded with Bun's own --shard, balanced by the committed timings file
  # rather than by file count (ADR 0016). A shard that flakes is re-run as its own job.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: >
          make test TESTS="test/integration
          --shard=${{ matrix.shard }}/3 --timings=test/integration.timings.json"
      - if: failure()
        run: docker compose logs

  # test/concurrency: three files, real wall-clock waits; nothing a time-based split would divide.
  concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: make test TESTS="test/concurrency"
      - if: failure()
        run: docker compose logs

  # The one required status check: depends on the four above and runs nothing of its own, so a
  # shard count or a job split never requires editing the main ruleset (ADR 0016). `if: always()`
  # plus the explicit result check make this job report failure rather than skip when a dependency
  # fails, which is what the ruleset's required_status_checks needs to see to block the merge.
  ci:
    needs: [static, fast, integration, concurrency]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
