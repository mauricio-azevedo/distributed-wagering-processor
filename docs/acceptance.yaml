    evidence: { testId: replay-returns-stored-outcome, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

  - id: IDEM-006
    priority: required
    requirement: A replay follows the persisted outcome and freezes once terminal.
    contract: idem.replay-follows-persisted-outcome
    enforcement:
      - Status, failure code and observed balance read from the row at replay time.
