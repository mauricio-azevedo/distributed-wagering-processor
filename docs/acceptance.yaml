    scenario:
      - SIGKILL a publisher holding a claimed batch it has not published, with the rest of the backlog still claimable, then run another instance.
    expected:
      - While the first instance lives, another claim sees only the rows it did not take; once it is killed, the surviving instance publishes every row of the backlog, each at its first attempt.
