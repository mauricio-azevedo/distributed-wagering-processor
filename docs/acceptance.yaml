    contract: [api.retry-after, api.transient-failure]
    enforcement:
      - Infrastructure errors classified as transient map to 503; transientDatabaseFailure reads the SQLSTATE of a lock timeout, a serialization failure, a deadlock, a cancelled statement and an unreachable or shutting-down database, and the unit suite covers that taxonomy.
      - lock_timeout, set on every financial transaction from LOCK_TIMEOUT_MS, is what bounds the wait for the wallet row.
      - A failure raised before the financial transaction commits leaves it rolled back, so the key is free and the resend is a new operation. The case where the commit outcome is unknown is API-013, and its expectation is the opposite.
    scenario:
