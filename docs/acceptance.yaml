    verificationStatus: passing

  - id: IDEM-004
    priority: required
    requirement: The payload hash is deterministic, covers exactly the business fields and ignores transport.
    contract: idem.payload-hash
    enforcement:
      - 'RFC 8785 canonical JSON over the validated business fields; SHA-256; sha256: prefix.'
      - canonicalJson of src/domain/canonical-json.ts, held to the RFC's own vectors by canonical-json-follows-rfc-8785, including its UTF-16 code-unit ordering of property names.
      - payloadHashOf projects exactly the business fields, so transport members of a wider object cannot reach the hash, and the amount passes through the domain money parser.
    scenario:
      - Hash the same payload with keys in different order, with different headers and message ids; hash a payload differing in one business field.
    expected:
      - Identical hashes in the first group, equal to a fixed vector; a different hash for the changed field.
    evidence: { testId: payload-hash-canonical, layer: unit }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

