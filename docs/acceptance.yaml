# Acceptance plan
#
# Every obligation of the service, mapped to the rules it realises (docs/system-contract.md), how it
# is enforced, the scenario that proves it, the expected outcome and the test that will carry the
# evidence. Implementation slices (docs/implementation-plan.md) turn entries green; this file is the
# scoreboard and, at the end, the release report.
#
# Fields
#   id                    <AREA>-<NNN>. Areas: MODEL MONEY WALLET TX LEDGER RULE IDEM CONC SCHEMA API
#                         MSG OUTBOX REF OBS RECON OPS AUTH.
#   priority              required | optional (optional entries are extensions, never scheduled by default)
#   requirement           the obligation, in the system's own terms
#   contract              rule id(s) from docs/system-contract.md
#   enforcement           what makes it true: code, schema, configuration
#   scenario / expected   the proving scenario and its observable outcome
#   evidence.testId       stable identifier of the test that carries the evidence
#   evidence.layer        unit | schema | integration | concurrency | contract | manual
#   deliverySlice         slice id from docs/implementation-plan.md
#   implementationStatus  planned | in-progress | implemented | deferred
#   verificationStatus    not-run | passing | failing (passing requires implemented)
#
# A test id is traceability, not evidence: an entry is verified only when its status says so.

version: 1
entries:
  # ---------------------------------------------------------------- MODEL
  - id: MODEL-001
    priority: required
    requirement: Domain objects are created only through static factories; constructors are not reachable.
    contract: model.private-constructors
    enforcement:
      - Private or protected constructors on Money, Wallet, WagerTransaction, WalletLedgerEntry, InboxMessage, OutboxMessage.
      - Factories from, zero, open, create validate their inputs; receive takes the validated message body and enqueue takes the event itself.
    scenario:
      - Compile a call to each constructor from outside the class.
      - Create each object through its factory with valid input.
    expected:
      - The constructor call is a type error.
      - The factory returns an instance in its initial state.
    evidence: { testId: domain-factories-are-the-only-entry, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MODEL-002
    priority: required
    requirement: Rehydration rebuilds persisted state without re-validating transitions.
    contract: model.rehydrate-no-revalidation
    enforcement:
      - rehydrate(state) assigns fields directly and runs no transition rule.
    scenario:
      - Rehydrate a WagerTransaction already in PROCESSED with a processedAt and a reference.
      - Rehydrate a Wallet with version 7 and a non-zero balance.
    expected:
      - Both instances expose the stored state unchanged and throw nothing.
    evidence: { testId: rehydrate-trusts-stored-state, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MODEL-003
    priority: required
    requirement: State changes happen through named transitions, and terminal transactions refuse any transition.
    contract: model.explicit-transitions
    enforcement:
      - markProcessed, markPendingReference, reject and fail are the only mutators of status.
      - Each transition checks isTerminal() first and throws InvalidTransactionStateError.
      - markProcessed on an inbox row and markPublished and scheduleRetry on an outbox row are the only mutators of a message record; a completed record throws InvalidMessageStateError.
    scenario:
      - Move a PENDING transaction to PROCESSED, then call reject on it.
    expected:
      - The second call throws InvalidTransactionStateError and the status stays PROCESSED.
    evidence: { testId: terminal-transaction-refuses-transitions, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MODEL-004
    priority: required
    requirement: Money and ledger entries are structurally immutable.
    contract: [model.structural-immutability, money.immutable]
    enforcement:
      - Only readonly fields; no setters; every Money operation returns a new instance.
    scenario:
      - Add two Money values; attempt to assign a field of a WalletLedgerEntry.
    expected:
      - The operands are unchanged and the result is a new object; the assignment is a type error.
    evidence: { testId: money-and-ledger-entry-are-immutable, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MODEL-005
    priority: required
    requirement: The domain layer imports nothing from frameworks, the ORM or transports.
    contract: model.framework-free-domain
    enforcement:
      - Dependency rule checked by a test over the import graph of src/domain.
      - Persistence maps row classes of the infrastructure layer, so no mapping reaches into the domain (ADR 0008).
    scenario:
      - Collect every import under src/domain.
    expected:
      - No import names a package at all, so none resolves to @nestjs, @mikro-orm, @aws-sdk or node:http.
      - No relative import leaves src/domain, so the layer reaches no other layer either.
    evidence: { testId: domain-import-graph-is-clean, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MODEL-006
    priority: required
    requirement: Shapes are defined once, in the transport contracts; the code implements them and every amount is a string.
    contract: [model.money-props-in-contracts, model.contract-first, api.contract-document]
    enforcement:
      - DTOs with validation implement docs/openapi.yaml; message and event classes implement docs/asyncapi.yaml; review on change.
    scenario:
      - Submit a bet, read the wallet, page the ledger and reconcile; capture one message and one event of each type.
    expected:
      - Every captured body and payload validates against the schema of its operation or message in the contract documents; every money field is a string with the two-decimal pattern.
    evidence: { testId: payloads-validate-against-contracts, layer: contract }
    deliverySlice: http-observability-shutdown
    implementationStatus: planned
    verificationStatus: not-run

  # ---------------------------------------------------------------- MONEY
  - id: MONEY-001
    priority: required
    requirement: Money.from accepts exactly the two-decimal string form and nothing else.
    contract: money.decimal-string
    enforcement:
      - Strict pattern match before parsing into bigint minor units.
    scenario:
      - Parse "0.00", "0.05", "460.00", "999999999999999999.99".
    expected:
      - All parse; toString returns the input unchanged.
    evidence: { testId: money-accepts-two-decimal-strings, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-002
    priority: required
    requirement: Malformed amounts are rejected as domain validation errors.
    contract: money.rejected-inputs
    enforcement:
      - Pattern match rejects before any arithmetic.
    scenario:
      - Parse "NaN", "Infinity", "1e3", "", "-1.00", "+1.00", " 1.00", "1,00", "01.00", "1.0", "1.000", "1000000000000000000.00", and the JSON number 1.
    expected:
      - Every input throws a validation error naming the offending value.
    evidence: { testId: money-rejects-malformed-input, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-003
    priority: required
    requirement: No code path rounds an amount.
    contract: money.no-rounding
    enforcement:
      - Money exposes no rounding operation; wrong scale is rejected at the boundary.
    scenario:
      - Parse "1.005"; add "0.10" and "0.20".
    expected:
      - '"1.005" is rejected; the sum is exactly "0.30".'
    evidence: { testId: money-never-rounds, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-004
    priority: required
    requirement: Currency codes are three uppercase letters.
    contract: money.currency-iso
    enforcement:
      - Pattern check in Money.from and in every DTO carrying money.
    scenario:
      - Parse money with currency "BRL", "brl", "BR", "BRLX".
    expected:
      - Only "BRL" is accepted.
    evidence: { testId: money-currency-code-format, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-005
    priority: required
    requirement: Arithmetic and comparison across currencies throw a domain error.
    contract: money.same-currency
    enforcement:
      - assertSameCurrency in add, subtract, isLessThan and equals.
    scenario:
      - Add 10.00 BRL and 10.00 USD; compare them.
    expected:
      - Both calls throw CurrencyMismatchError.
    evidence: { testId: money-rejects-currency-mismatch, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-006
    priority: required
    requirement: An operation that moves money carries a strictly positive amount; a LOSS may carry zero.
    contract: [money.positive-in-operations, money.zero-only-initial-balance]
    enforcement:
      - The per-kind variants of the submission schema in docs/openapi.yaml and docs/asyncapi.yaml bind the positive amount to BET, WIN, REFUND and ROLLBACK; the DTOs implement them on POST /wagering/transactions and on the queue message.
    scenario:
      - Submit a BET of "0.00", a WIN of "0.00", a REFUND of "0.00", a ROLLBACK of "0.00", a BET of "-5.00" and a LOSS of "-5.00".
      - Submit a LOSS of "0.00" against a wallet holding 460.00.
    expected:
      - Every submission in the first group answers 400 VALIDATION_FAILED and persists no transaction row.
      - The LOSS of "0.00" answers 200 PROCESSED with balance 460.00, no ledger entry and an unchanged version.
    evidence: { testId: submission-validation-follows-the-contract, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-007
    priority: required
    requirement: Zero is accepted as an initial balance and as a LOSS amount, and nowhere else.
    contract: money.zero-only-initial-balance
    enforcement:
      - OpenWalletRequest allows "0.00" by taking MoneyProps rather than the positive variant the money-moving operations take (MONEY-006); the ledger refuses "0.00" outright (LEDGER-006), which is why a zero opening writes no entry at all.
    scenario:
      - Open a wallet with "0.00".
    expected:
      - 201 with balance "0.00" and version 1, and no ledger entry.
    evidence: { testId: zero-initial-balance-accepted, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-008
    priority: required
    requirement: A negative amount appears only as a reconciliation difference.
    contract: money.signed-difference-only
    enforcement:
      - subtract yields the signed difference; operation DTOs reject signs; -0.00 is normalised to 0.00.
    scenario:
      - Compute 10.00 minus 12.50 as a difference; compute 10.00 minus 10.00.
    expected:
      - '"-2.50" and "0.00" respectively, never "-0.00".'
    evidence: { testId: signed-difference-formatting, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-009
    priority: required
    requirement: No JavaScript number ever holds money.
    contract: money.exact-persistence
    enforcement:
      - Money stores bigint minor units; toJSON emits strings; the ORM type maps strings.
    scenario:
      - Inspect Money internals and serialization for "9007199254740993.00".
    expected:
      - The value survives exactly; a number would have lost precision.
    evidence: { testId: money-uses-bigint-not-number, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-010
    priority: required
    requirement: Amounts persist exactly through the ORM mapping.
    contract: money.exact-persistence
    enforcement:
      - MoneyType keeps the NUMERIC(20,2) column exact as a decimal string in both directions and refuses a value that is not a string.
      - The mapping pairs it with the currency column of the row and rebuilds Money with the domain parser (ADR 0008).
    scenario:
      - Persist a wallet with balance "999999999999999999.99", the bound, and read it back in a new unit of work.
      - Do the same with "0.00", "0.01", "1.50", "40.00", "100000000000.10" and with a wallet in another currency.
    expected:
      - Every balance equals the original to the cent, trailing zeros included, and the column holds 999999999999999999.99.
    evidence: { testId: money-round-trips-through-postgres, layer: integration }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-011
    priority: required
    requirement: BRL is the operational currency while the model rejects currency conflicts.
    contract: money.brl-operational-scope
    enforcement:
      - Wallets carry their currency; operations carry theirs; mismatch is a persisted rejection.
    scenario:
      - Open a BRL wallet; submit a BET in USD against it.
    expected:
      - 422 REJECTED with CURRENCY_MISMATCH; balance and ledger unchanged.
    evidence: { testId: wallet-rejects-foreign-currency, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-012
    priority: required
    requirement: Money is bounded by the storage capacity and arithmetic never overflows silently.
    contract: money.bound
    enforcement:
      - Money.from rejects a magnitude above 999999999999999999.99; add throws MoneyOverflowError when a sum would exceed it.
    scenario:
      - Parse "999999999999999999.99" and "1000000000000000000.00"; add "0.01" to the bound; subtract the bound from "0.00" and negate the result.
    expected:
      - The bound parses and prints unchanged; the 19-digit value is rejected; the addition throws MoneyOverflowError; the subtraction yields "-999999999999999999.99" and negating it yields the bound.
    evidence: { testId: money-is-bounded-by-storage, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: MONEY-013
    priority: required
    requirement: A credit that would take the balance above the bound is a persisted rejection.
    contract: wallet.balance-limit
    enforcement:
      - Wallet.credit checks the bound before producing an entry; the use case persists REJECTED with BALANCE_LIMIT_EXCEEDED.
    scenario:
      - Open a wallet with "999999999999999999.00"; submit a WIN of "1.00"; submit a WIN of "0.99".
    expected:
      - The first WIN is 422 REJECTED with BALANCE_LIMIT_EXCEEDED and leaves balance, ledger and version unchanged; the second is PROCESSED and the balance equals the bound.
    evidence: { testId: credit-past-the-bound-is-rejected, layer: integration }
    deliverySlice: reversals-references
    implementationStatus: implemented
    verificationStatus: passing

  # ---------------------------------------------------------------- WALLET
  - id: WALLET-001
    priority: required
    requirement: A player has at most one wallet per currency; a duplicate is a conflict.
    contract: [wallet.unique-player-currency, wallet.duplicate-is-conflict]
    enforcement:
      - UNIQUE (player_id, currency); the wallet repository translates a violation of that key into WalletAlreadyExistsError and the exception filter answers 409 WALLET_ALREADY_EXISTS. The use case reads nothing first, so the key is the only check and it decides for every instance at once.
    scenario:
      - Open a BRL wallet for a player twice, the second time concurrently from two instances, each its own process; open a USD wallet for the same player.
    expected:
      - Exactly one wallet exists per currency; every other attempt answers 409 and changes nothing.
    evidence: { testId: one-wallet-per-player-and-currency, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-002
    priority: required
    requirement: A wallet balance is never negative.
    contract: wallet.non-negative
    enforcement:
      - Wallet.debit refuses to go below zero; CHECK (balance >= 0) in the schema.
    scenario:
      - Debit 101.00 from a wallet holding 100.00 in the domain; attempt the same with direct SQL.
    expected:
      - The domain raises an insufficient-balance outcome; the SQL statement fails on the check constraint.
    evidence: { testId: wallet-balance-never-negative, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-003
    priority: required
    requirement: A new wallet has version 1, with or without an opening credit.
    contract: wallet.version-starts-at-one
    enforcement:
      - Wallet.open sets version 1 and applies the opening credit without incrementing.
    scenario:
      - Open one wallet with "500.00" and one with "0.00".
    expected:
      - Both report version 1; the first has one ledger entry with walletVersion 1.
    evidence: { testId: wallet-opens-at-version-one, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-004
    priority: required
    requirement: The version increments exactly once per balance change and never otherwise.
    contract: wallet.version-increments-on-balance-change
    enforcement:
      - Only debit and credit increment; LOSS, rejections and replays do not touch the wallet row.
    scenario:
      - Open with "100.00" (v1); BET "40.00"; replay the BET; BET "100.00" rejected; LOSS.
    expected:
      - Version is 2 after the first BET and still 2 after the replay, the rejection and the LOSS.
    evidence: { testId: version-tracks-balance-changes-only, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-005
    priority: required
    requirement: Every balance change has exactly one ledger entry and the stored balance mirrors the ledger head at commit.
    contract: wallet.ledger-mirror
    enforcement:
      - Two deferred constraint triggers, on wallets and on the ledger, refuse a mismatch at commit, so the guarantee holds for every writer and does not wait for a use case.
      - The use cases of the later slices write the wallet row and its entry in one transaction; that they do is WALLET-004 and TX-001, not this entry.
    scenario:
      - 'By SQL as the runtime role: commit a balance change with its entry; commit three changes in one transaction, mirrored by the last; move the wallet row before appending the entry; then update the balance without an entry.'
    expected:
      - Each committed change leaves one entry whose balanceAfter equals the stored balance and whose walletVersion equals the stored version, whichever half was written first.
      - The update without an entry fails at commit and leaves the wallet and its ledger as they were.
    evidence: { testId: balance-and-ledger-move-together, layer: schema }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-006
    priority: required
    requirement: An operation in another currency than the wallet is rejected and persisted.
    contract: wallet.currency-match
    enforcement:
      - Wallet.debit and Wallet.credit refuse a foreign currency before any arithmetic; outcome REJECTED CURRENCY_MISMATCH.
    scenario:
      - Submit a USD BET against a BRL wallet.
    expected:
      - 422 with failureCode CURRENCY_MISMATCH; the transaction row exists as REJECTED; no entry.
    evidence: { testId: wallet-rejects-foreign-currency, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-007
    priority: required
    requirement: An operation naming a player other than the wallet owner is rejected and persisted.
    contract: wallet.owner-match
    enforcement:
      - The use case compares payload playerId with the wallet owner under the lock.
    scenario:
      - Submit a BET with another player's id against a wallet.
    expected:
      - 422 with failureCode WALLET_PLAYER_MISMATCH; balance unchanged; row persisted.
    evidence: { testId: wallet-rejects-foreign-player, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-008
    priority: required
    requirement: A positive initial balance is recorded as an OPENING transaction with its CREDIT entry in the same transaction.
    contract: wallet.opening-credit
    enforcement:
      - OpenWallet writes the wallet, the OPENING transaction already PROCESSED, its CREDIT entry and the two outbox rows in one unit of work.
    scenario:
      - Open a wallet with "500.00"; in a second run inject a failure after the OPENING transaction insert, so the wallet and the transaction have already reached PostgreSQL when it is raised.
    expected:
      - 'First run: wallet, OPENING row (providerId system, idempotencyKey system:<walletId>, gameId wallet-opening), entry (balanceBefore 0.00, balanceAfter 500.00, walletVersion 1) and the processed and balance-changed outbox rows all exist. Second run: no row in any table.'
    evidence: { testId: opening-credit-is-atomic, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-009
    priority: required
    requirement: A zero initial balance creates the wallet alone.
    contract: wallet.zero-opening
    enforcement:
      - OpenWallet skips the OPENING transaction when the balance is zero.
    scenario:
      - Open a wallet with "0.00".
    expected:
      - No transaction row, no ledger entry, version 1, no WalletBalanceChanged event.
    evidence: { testId: zero-opening-writes-only-the-wallet, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-010
    priority: required
    requirement: A wallet can be read with its current balance and version.
    contract: [wallet.read-shape, api.wallet-read]
    enforcement:
      - GET /wallets/{walletId} maps the aggregate to the response DTO; GetWallet raises WalletNotFoundError for an unknown id, so the absence is a use-case decision and not a controller reading a null.
    scenario:
      - Read an existing wallet, an unknown id and an id that is not a UUID.
    expected:
      - 200 with exactly id, playerId, balance, version, createdAt, updatedAt; 404 WALLET_NOT_FOUND for the unknown id; 400 VALIDATION_FAILED naming /path/walletId for the malformed one.
    evidence: { testId: wallet-read-endpoint, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-011
    priority: required
    requirement: The aggregate itself refuses an uncovered debit, a foreign currency, a foreign owner and a credit past the money bound.
    contract: [wallet.non-negative, wallet.currency-match, wallet.owner-match, wallet.balance-limit]
    enforcement:
      - Wallet.debit and Wallet.credit validate owner, currency, cover and bound before changing anything, and expose no setter.
      - The use case only persists the refusal and maps its failure code; the schema repeats the guarantee (SCHEMA-002, WALLET-002).
    scenario:
      - 'Rehydrate a wallet holding 100.00 BRL for player-1, with no database and no clock: debit 100.01; debit 50.00 USD; credit 50.00 USD; operate as player-2; credit an amount that would take the balance past money.bound.'
      - On fresh instances of the same wallet, debit 100.00 and credit 1.00.
    expected:
      - The five attempts are refused by the aggregate with INSUFFICIENT_BALANCE, CURRENCY_MISMATCH, CURRENCY_MISMATCH, WALLET_PLAYER_MISMATCH and BALANCE_LIMIT_EXCEEDED, leaving balance and version unchanged.
      - The last two succeed; the test touches no port, no repository and no container.
    evidence: { testId: wallet-aggregate-invariants, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: WALLET-012
    priority: required
    requirement: A balance change on the aggregate yields exactly one ledger entry mirroring the new state, and nothing else moves the version.
    contract: [wallet.version-increments-on-balance-change, wallet.ledger-mirror]
    enforcement:
      - debit and credit return the WalletLedgerEntry they imply, carrying balanceBefore, balanceAfter and the new walletVersion; a refused operation returns none and mutates nothing.
    scenario:
      - 'On a wallet at version 3 holding 100.00, with no database: debit 40.00, then credit 10.00, then attempt a debit of 1000.00.'
    expected:
      - Version 4 then 5, and 5 again after the refusal; balance 60.00, 70.00, 70.00.
      - The two entries are DEBIT 40.00 (100.00 to 60.00, walletVersion 4) and CREDIT 10.00 (60.00 to 70.00, walletVersion 5); the refused debit yields no entry.
    evidence: { testId: balance-and-version-move-with-one-entry, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  # ---------------------------------------------------------------- TX
  - id: TX-001
    priority: required
    requirement: Only the five provider kinds can be submitted; OPENING and the provider id system are refused on both entry points.
    contract: [tx.kinds, tx.opening-internal]
    enforcement:
      - DTO enum excludes OPENING; providerId validation excludes system; the consumer classifies the violation as permanent.
    scenario:
      - Submit kind OPENING over HTTP; submit providerId system over HTTP; send both through the queue.
    expected:
      - HTTP answers 400 VALIDATION_FAILED; the messages land in the dead-letter queue; nothing is persisted.
    evidence: { testId: internal-kind-and-provider-are-refused, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: in-progress
    verificationStatus: not-run

  - id: TX-002
    priority: required
    requirement: A provider transaction id identifies exactly one transaction per provider.
    contract: tx.identity
    enforcement:
      - UNIQUE (provider_id, external_transaction_id); reservation insert uses ON CONFLICT.
    scenario:
      - Submit two different payloads with the same providerId and externalTransactionId under different keys.
    expected:
      - The second answers 409 EXTERNAL_TRANSACTION_ALREADY_BOUND; one row exists.
    evidence: { testId: idempotency-conflicts-persist-nothing, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

  - id: TX-003
    priority: required
    requirement: A new transaction is PENDING and its reference requirement is validated by kind.
    contract: [tx.born-pending, tx.reference-matrix]
    enforcement:
      - WagerTransaction.create checks requiresReference() and allowsReference().
    scenario:
      - Create REFUND and ROLLBACK without a reference; BET with a reference; WIN and LOSS with and without.
    expected:
      - The first three throw; the WIN and LOSS variants are created in PENDING.
    evidence: { testId: reference-requirement-by-kind, layer: unit }
    deliverySlice: domain-money-transitions
    implementationStatus: implemented
    verificationStatus: passing

  - id: TX-004
    priority: required
    requirement: A transaction cannot reference itself.
    contract: tx.self-reference-invalid
    enforcement:
      - DTO-level check that referenceExternalTransactionId differs from externalTransactionId.
    scenario:
      - Submit a ROLLBACK whose reference equals its own external id.
    expected:
      - 400 VALIDATION_FAILED; nothing persisted.
    evidence: { testId: submission-validation-follows-the-contract, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

  - id: TX-005
    priority: required
    requirement: Only the documented status transitions exist.
    contract: tx.transitions
    enforcement:
      - A transition table in WagerTransaction; every method consults it.
    scenario:
      - Exercise every pair of statuses.
    expected:
