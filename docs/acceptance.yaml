  - id: SCHEMA-024
    priority: required
    requirement: A transaction row that reached a terminal status refuses every update, and no transaction row is ever deleted.
    contract: [tx.terminal-immutable, tx.row-append-only]
    enforcement:
      - BEFORE UPDATE OR DELETE trigger on wager_transactions raising integrity_constraint_violation (23000) when the old row is PROCESSED, REJECTED or FAILED, and on every delete.
      - The runtime role holds no DELETE privilege; the trigger covers the migrator and manual SQL.
    scenario:
      - 'By SQL as the runtime role: set a PROCESSED row back to PENDING clearing processed_at; rewrite observed_balance on a PROCESSED row; turn a PROCESSED row into REJECTED with a failure code; change the failure code of a REJECTED row.'
      - 'By SQL as the schema owner: delete a PROCESSED row and delete a PENDING row.'
      - 'By SQL as the runtime role, the writes that must still work: PENDING to PROCESSED with processed_at and observed_balance; PENDING to PENDING_REFERENCE; a PENDING_REFERENCE row reaching PROCESSED with its resolved reference_transaction_id.'
      - Repeat the downgrade against a table carrying the same CHECK constraints and no trigger.
    expected:
      - Every attempt in the first two groups is refused with SQLSTATE 23000 and leaves the row unchanged.
      - Every write in the third group commits.
      - The table without the trigger accepts the downgrade, which is exactly what SCHEMA-007 alone admits and why this entry exists.
    evidence: { testId: schema-terminal-rows-are-frozen, layer: schema }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: SCHEMA-025
    priority: required
    requirement: The identity, context, kind, amount and currency of a transaction row never change after insertion.
    contract: tx.row-append-only
    enforcement:
      - The same trigger compares the frozen columns of the old and new row images with IS DISTINCT FROM, leaving only status, processed_at, failure_code, observed_balance and reference_transaction_id writable while the row is not terminal.
    scenario:
      - 'By SQL as the runtime role, one update per column on a PENDING row and on a PENDING_REFERENCE row: amount, currency, kind, wallet_id, player_id, round_id, game_id, provider_id, external_transaction_id, idempotency_key, payload_hash, reference_external_transaction_id, created_at.'
      - Update only the outcome fields of the same rows.
    expected:
      - Every column update is refused with SQLSTATE 23000 and leaves the row unchanged.
      - The outcome-field update commits, so a parked transaction can still be resolved and a pending one decided.
    evidence: { testId: schema-transaction-identity-frozen, layer: schema }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing
  - id: SCHEMA-026
    priority: required
    requirement: No monetary column can store the non-finite NUMERIC value NaN.
    contract: [money.finite-in-database, money.exact-persistence]
    enforcement:
      - Each monetary column carries a CHECK of its own excluding it with <> 'NaN'::numeric, kept apart from the range check of the same column so that one can be dropped without the other. The range, equality and arithmetic checks do not exclude it, because PostgreSQL orders NaN above every number, NaN = NaN is true, and NaN propagates through addition.
    scenario:
      - Read back every CHECK of the schema carrying the exclusion.
      - By SQL as the runtime role, insert NaN into each monetary column: wallet balance, transaction amount and observed_balance, ledger amount, balance_before and balance_after.
      - As the migrator role, drop the four exclusions a balance change passes through (the three of the ledger and the one of the wallet balance), then commit in one transaction a two-entry chain whose amounts, balance_before and balance_after are NaN with the wallet row moved onto its head; restore the four NOT VALID, then insert another NaN entry and move the balance to NaN; truncate and recreate them validated afterwards.
    expected:
      - The columns they guard are exactly the six monetary columns of the schema.
      - Every insert of the second scenario is refused by a finiteness CHECK of its own table. Which one reports a ledger entry is the server's choice, because NaN propagates through addition and an entry cannot carry it in one monetary column alone without failing the balanced arithmetic.
      - The chain of the third scenario commits while the exclusions are absent, proving that the positive-amount check, the non-negative balance_after, the balanced arithmetic and the two deferred triggers of SCHEMA-017, SCHEMA-021 and SCHEMA-022 all accept NaN: NaN = NaN holds, so every link of the chain matches and the wallet row mirrors its head. The entry and the balance written after the exclusions are restored are both refused, each by the check of its own table.
    evidence: { testId: schema-refuses-non-finite-amounts, layer: schema }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

