  # ---------------------------------------------------------------- CONC
  - id: CONC-001
    priority: required
    requirement: Operations serialize per wallet and run in parallel across wallets.
    contract: [conc.unit-wallet, conc.parallel-wallets]
    enforcement:
      - Row lock on the wallet; no shared lock.
    scenario:
      - 200 wallets each receiving 20 bets, all submitted at once from three processes, then the same submissions aimed at one wallet as the baseline the first run is measured against.
    expected:
      - Every wallet ends at version 21 with twenty debits and consistent with its ledger.
      - One operation on a wallet of its own costs a fraction of one queued behind the rest, measured per operation so the comparison calibrates itself on the machine it runs on. The margin asserted sits just above the ratio of one that a lock wider than the row would produce, rather than near the ratio measured, so a busy machine cannot fail the case and a global lock cannot pass it.
    evidence: { testId: distinct-wallets-in-parallel, layer: concurrency }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: CONC-002
    priority: required
    requirement: Processing holds the wallet row lock in a short transaction and treats lock timeouts as transient.
    contract: conc.row-lock
    enforcement:
      - SELECT ... FOR NO KEY UPDATE in the wallet repository; lock_timeout configured; mapping to 503 and to queue retry.
      - The count is raised in the unit of work, where the wait is classified, so it is one measurement over both entry points instead of one entry point counting what the other does not.
    scenario:
      - Hold a lock on a wallet from the migrator's connection; submit a bet over HTTP and deliver one through the queue.
    expected:
      - Over HTTP, 503 with Retry-After and nothing persisted.
      - On the queue, the delivery is classified transient and the message returned rather than acknowledged, nothing is written, not even the inbox row, and the redelivery is applied as a new operation rather than replayed. The case runs against the consumer the composition root built, so the counter is evidence about the deployment's wiring; the backoff a returned message comes back on is MSG-007.
      - wager_lock_conflicts_total is incremented in both cases.
    evidence: { testId: lock-timeout-is-transient, layer: integration }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: CONC-003
    priority: required
    requirement: Writes that bypass the lock are detected by the version guard and the check constraint.
    contract: conc.version-guard
    enforcement:
      - UPDATE ... WHERE version = expected; CHECK (balance >= 0).
    scenario:
      - Update against a version the row no longer carries; and the bypass itself, two sessions that both read the wallet without locking it and both write the balance they computed.
    expected:
      - Zero rows updated and an error raised in both cases, so the second writer's balance is refused instead of overwriting the first's: one debit, one entry, the wallet at version 2.
      - The check constraint that refuses a negative balance whatever the code does is SCHEMA-002, which keeps that half of the defence provable with no application code in the picture.
    evidence: { testId: version-guard-and-check, layer: integration }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: CONC-004
    priority: required
    requirement: No global lock and no unguarded read-compute-write exist.
    contract: [conc.no-global-lock, conc.no-unguarded-rmw]
    enforcement:
      - A check over the source, inside the gate rather than in a review: a race test can only show that today's paths serialize, never that tomorrow's second writer does not exist.
    scenario:
      - Scan src, comments stripped, for advisory and table locks; for every row-locking clause; for every write to the wallets table; and for every caller of the lock and of the balance update.
    expected:
      - No advisory lock and no table lock anywhere.
      - Every row lock is one of the three reviewed ones, in its reviewed mode and its own repository: the wallet lock as FOR NO KEY UPDATE, the outbox claim as FOR UPDATE SKIP LOCKED, and the scheduler's claim as FOR UPDATE OF "s" SKIP LOCKED. The whole set is asserted, so another one has to be considered against conc.lock-order before it passes.
      - The wallet repository is the only writer of the table and its update is constrained by the version the lock read. The lock is taken by the two operation paths alone, a submission and a scheduled attempt, each preceded by a claim of its own; the balance is written by the one step they share, so the guarded update cannot come to exist twice with two notions of the expected version.
    evidence: { testId: wallet-concurrency-is-structural, layer: unit }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: CONC-005
    priority: required
    requirement: Every guarantee holds with three or more instances.
    contract: conc.multi-instance
    enforcement:
      - Coordination only through PostgreSQL.
    scenario:
      - Run every scenario of the concurrency suite through three instances, each a process of its own with its own heap, entity manager and connection pool, armed and then started on an agreed instant.
    expected:
      - The three instances are distinct operating-system processes, none of them the suite, which is what a suite racing objects in one runtime could not claim.
      - The exactly-once decisions cross them: the copy that applies a duplicate storm runs in one instance and every other instance replays it rather than applying its own.
    evidence: { testId: three-instances-suite, layer: concurrency }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: CONC-006
    priority: required
    requirement: Two bets racing for one balance produce exactly one debit.
    contract: conc.canonical-scenario
    enforcement:
      - Row lock serializes; the second decision sees the first debit.
    scenario:
      - Open with 100.00; submit two 80.00 bets simultaneously from two processes; retry both, also simultaneously. Twenty rounds, each on a wallet of its own.
    expected:
      - One PROCESSED, one REJECTED INSUFFICIENT_BALANCE, balance 20.00, the wallet at version 2 and one DEBIT entry beside the opening CREDIT.
      - Both retries replay the outcome their own transaction recorded, and neither moves the balance or writes a second entry.
    evidence: { testId: two-bets-one-balance, layer: concurrency }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: CONC-007
    priority: required
    requirement: Fifty parallel copies of one bet produce one debit and forty-nine replays.
    contract: conc.duplicate-storm
    enforcement:
      - Reservation insert before the lock; duplicates wait on the unique index.
    scenario:
      - Submit the same bet fifty times at once across three processes, three rounds over.
    expected:
      - One row, one DEBIT entry for the BET, one debit; forty-nine answers with idempotentReplay true, every one of them carrying the transaction id the single applied copy recorded.
      - The counts are scoped to the BET: the wallet was opened with a positive balance, so it already holds its OPENING CREDIT at walletVersion 1 and ends with two entries at version 2.
    evidence: { testId: fifty-duplicates-one-debit, layer: concurrency }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: CONC-008
    priority: required
    requirement: The lock order inside the financial transaction is fixed and deadlock-free.
    contract: conc.lock-order
    enforcement:
      - One code path in the use case; reviewed order; FOR NO KEY UPDATE on the wallet; no network call under the lock.
    scenario:
      - Mix bets, duplicates of them and both reversal kinds naming the same targets, on one wallet, from three processes at once. The load is a fixed number of operations rather than a stretch of time, so a run means the same thing on every machine, and the evidence is PostgreSQL's own deadlocks counter for the database, read before and after.
    expected:
      - The counter is unchanged, which is stronger than the absence of an error in the outcomes: a deadlock something retried would leave every outcome looking correct.
      - Exactly one reversal per target is PROCESSED and the other is REJECTED with REFERENCE_ALREADY_REVERSED, the duplicates replay, and the wallet reconciles against its ledger.
    evidence: { testId: mixed-load-no-deadlock, layer: concurrency }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: CONC-009
    priority: required
    requirement: Reserving the transaction row before locking its wallet cannot deadlock.
    contract: [conc.row-lock, conc.lock-order]
    enforcement:
      - The wallet lock is FOR NO KEY UPDATE, compatible with the FOR KEY SHARE the reservation's foreign key holds on the wallet row.
    scenario:
      - "Two database sessions on one wallet, by SQL: each inserts a transaction row, pauses, locks the wallet with the repository's statement, updates balance and version and commits; repeat ten times. Control: the same with FOR UPDATE."
    expected:
      - With the repository's lock every pair serializes with consecutive versions and no error; the control reports deadlock detected (SQLSTATE 40P01) in every pair.
    evidence: { testId: reservation-then-lock-no-deadlock, layer: integration }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

