  # ---------------------------------------------------------------- REF
  - id: REF-001
    priority: required
    requirement: An unresolved reference parks the transaction, answers 202 or acknowledges, and emits the pending event once.
    contract: [ref.parked-state, rule.reference.missing-is-pending]
    enforcement:
      - PENDING_REFERENCE status, schedule row and a single WagerTransactionPendingReference, all committed by the arrival that parked the transaction.
      - The HTTP half is implemented and asserted; the queue acknowledges a parked submission by the classification of msg.classification, and no case drives one through the consumer yet, which is why this entry is not yet green.
    scenario:
      - Submit a ROLLBACK and a REFUND before their BET over HTTP, then sweep the scheduler once with the reference still missing.
    expected:
      - 202 with Location; one schedule row at attempts 0, due a second after the receipt and expiring an hour after it; one pending event, and none from the retry attempt.
    evidence: { testId: missing-reference-is-parked, layer: integration }
    deliverySlice: reversals-references
    implementationStatus: in-progress
    verificationStatus: not-run

  - id: REF-002
    priority: required
    requirement: The scheduler claims due rows exclusively and survives crashes.
    contract: ref.scheduler
    enforcement:
      - SELECT ... FOR UPDATE SKIP LOCKED on pending_reference_schedule, one row claimed per database transaction, joined with the transaction status so a settled transaction leaves the claim list (ADR 0011).
      - The attempts counter of a schedule row is the evidence of exclusivity: a row two workers reprocessed would carry two attempts, and a wallet credited twice would fail the ledger reconciliation of RECON-004.
    scenario:
      - Three parked ROLLBACKs with a worker in a process of its own holding the claim on one of them: sweep from another worker, then kill the holder mid-attempt and drain. Then six parked ROLLBACKs drained by three worker processes at once.
    expected:
      - The held row is skipped while it is claimed and is PROCESSED after the holder is killed; every transaction is reprocessed exactly once, each schedule row carries one attempt, and every wallet reconciles.
    evidence: { testId: scheduler-exclusive-claims, layer: concurrency }
    deliverySlice: reversals-references
    implementationStatus: implemented
    verificationStatus: passing

  - id: REF-003
    priority: required
    requirement: Retry attempts follow exponential backoff capped at five minutes.
    contract: ref.backoff
    enforcement:
      - nextAttemptAt = now + min(1s * 2^attempt, 5m).
    scenario:
      - Compute the schedule for attempts 0 to 12.
    expected:
      - 1s, 2s, 4s, ..., 256s, then 300s for every later attempt.
    evidence: { testId: pending-reference-backoff, layer: unit }
    deliverySlice: reversals-references
    implementationStatus: implemented
    verificationStatus: passing

  - id: REF-004
    priority: required
    requirement: A pending reference expires after sixty minutes with REFERENCE_NOT_FOUND and its event.
    contract: [ref.ttl, ref.expiry]
    enforcement:
      - expires_at = first receipt + 60m, fixed when the transaction is parked and rewritten by no attempt; the scheduler rejects an attempt that ran and still found the reference missing (interpretation 17).
    scenario:
      - Park a ROLLBACK; sweep with a clock past sixty minutes. Then park one whose reference did arrive and sweep with the same clock.
    expected:
      - REJECTED with REFERENCE_NOT_FOUND, its observed balance and WagerTransactionRejected, with balance, version and ledger unchanged, replaying as 422 and claimed by no later sweep; the one whose reference arrived is applied instead.
    evidence: { testId: pending-reference-expires, layer: integration }
    deliverySlice: reversals-references
    implementationStatus: implemented
    verificationStatus: passing

  - id: REF-005
    priority: required
    requirement: Once the referenced transaction is processed, the next attempt applies the parked one under the normal rules.
    contract: ref.resolution-on-arrival
    enforcement:
      - Reprocessing reuses ApplyWagerOperation, the step a submission applies, on the stored row (ADR 0011), so every reference rule and every event is the one a first arrival would have produced.
    scenario:
      - Deliver a ROLLBACK before its BET; deliver the BET; sweep the scheduler. Separately, let the BET be reversed by a REFUND first and sweep again.
    expected:
      - The arrival of the BET changes nothing by itself; the next attempt records PROCESSED with the inverse entry, the balance before the BET and the resolved reference id; the reversed target is REJECTED with REFERENCE_ALREADY_REVERSED; the ledger reconciles.
    evidence: { testId: rollback-before-bet-resolves, layer: integration }
    deliverySlice: reversals-references
    implementationStatus: implemented
    verificationStatus: passing

  - id: REF-006
    priority: required
    requirement: Transient failures during reprocessing only reschedule; permanent ones mark FAILED.
    contract: [ref.transient-failure, ref.permanent-failure]
    enforcement:
      - Error classification in ReprocessPendingReference: ServiceUnavailableError, which the unit of work raises for every database failure a retry can clear, and anything nobody classified are transient and only reschedule; any other ApplicationError or a DomainError is permanent and marks FAILED (ADR 0011).
      - The counters wager_retries_total{component="scheduler"} and wager_transactions_total{status="FAILED"} arrive with the metrics (#20), which is why this entry is not yet green; the permanent failure is already logged at error level through the Logger port.
    scenario:
      - Park a transaction whose reference has arrived and make the attempt fail transiently, then sweep again cleanly. Park another and make its attempt hit a permanent failure, then replay the original request.
    expected:
      - The transient failure records nothing at all, counts one attempt and leaves expires_at where it was, and the next attempt applies the transaction; the permanent one is FAILED with PROCESSING_FAILED, emits no event, is logged with its transaction id and replays as 500.
    evidence: { testId: pending-reference-failure-classes, layer: integration }
    deliverySlice: reversals-references
    implementationStatus: in-progress
    verificationStatus: not-run

  # ---------------------------------------------------------------- RECON
  - id: RECON-001
    priority: required
    requirement: Reconciliation is consistent under concurrent writes and never blocks them.
    contract: recon.snapshot
    enforcement:
      - UnitOfWork.snapshot runs the report in one START TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY, with no FOR UPDATE anywhere in it, so both readings come from one snapshot and no write is even possible inside it.
      - Implemented with ReconcileWallet and verified deterministically by reconciliation-snapshot-is-consistent, which commits a competing balance change between the two readings of one report: the report carries the state before that commit and the writer is never blocked. This entry's own scenario adds the load, which is the only thing that can show the loop costing the betting nothing.
    scenario:
      - Reconcile one wallet continuously from the suite's process while three instances bet on it, then run the same load on a wallet nobody is reconciling as the cost to compare against.
    expected:
      - Every report is consistent, and the reports were taken while the balance was moving rather than all before or all after it: the entry counts they were taken over span the load.
      - Every bet is PROCESSED, and the load under the reconciliation loop costs less than twice the same load without it. The bound catches a report that started taking a lock, since a loop of those would stand between every pair of bets; it is deliberately not set near the difference measured, which is noise.
    evidence: { testId: reconciliation-under-load, layer: concurrency }
    deliverySlice: concurrent-debits
    implementationStatus: implemented
    verificationStatus: passing

  - id: RECON-002
    priority: required
    requirement: The report compares the stored balance with the ledger sum and the latest entry.
    contract: [recon.calculation, recon.report-shape]
    enforcement:
      - LedgerRepository.summarize answers one aggregate over the (wallet_id, wallet_version) index: SUM over credits minus debits, the number of entries it was taken over, and the balanceAfter of the entry at walletVersion = version. The sum is the database's, over NUMERIC(20,2), so it is exact however long the ledger is and nothing materializes it (ADR 0001).
      - The head comparison is not a restatement of the sum: a wallet whose version has drifted off its ledger sums correctly and is still reported divergent.
    scenario:
      - Reconcile a wallet with two entries and one with none.
    expected:
      - checkedEntries 2 and 0; difference 0.00; consistent true; all fields present.
    evidence: { testId: reconciliation-calculation, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: RECON-003
    priority: required
    requirement: A divergence is reported, logged and counted, never corrected.
    contract: recon.divergence-handling
    enforcement:
      - Error log with walletId, difference, checkedEntries; metric; response flag.
    scenario:
      - As the migrator role, bypass the triggers to create a divergence; reconcile.
    expected:
      - consistent false with the signed difference; one error log line; wager_reconciliation_divergence_total incremented; the stored balance unchanged.
    evidence: { testId: reconciliation-divergence, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: RECON-004
    priority: required
    requirement: Every suite that moves money ends by proving stored balance equals ledger-derived balance.
    contract: recon.final-invariant
    enforcement:
      - Shared helper (test/helpers/wallet-reconciliation.ts) that rebuilds a wallet's balance in SQL, as the sum of credits minus debits and as the balanceAfter of the entry at the wallet's version, and compares both with the stored balance. It recomputes the sum in SQL rather than reusing the service's arithmetic, so a defect there cannot agree with itself.
      - The suites truncate between tests, so the sweep runs in afterEach over the wallets that test touched, before its rows are removed.
      - Adopted by the suites that move money through a use case; each later slice adopts it with the suites it adds, which is why this entry is not yet green. The concurrency suite adopts it per scenario rather than per test, because a scenario that repeats rounds truncates between them: a sweep that waited for the test to end would find the rows of the last round alone.
      - TouchedWallets.forget drops a wallet from the sweep, for the fixtures of RECON-003 and RECON-005 alone: they corrupt a wallet on purpose to prove the report sees it, so the invariant the sweep asserts is the one such a case breaks.
    scenario:
      - Run the full suite.
    expected:
      - The helper runs for every touched wallet and passes.
    evidence: { testId: final-invariant-every-suite, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: in-progress
    verificationStatus: not-run
  - id: RECON-005
    priority: required
    requirement: Reconciliation never reports a wallet consistent on the strength of a non-finite stored value.
    contract: [recon.calculation, money.finite-in-database, money.exact-persistence]
    enforcement:
      - Stored amounts are rebuilt through the same parser that refuses NaN, so a corrupted row fails to rehydrate instead of comparing equal to itself. The equality of recon.calculation cannot carry this guarantee: in SQL a NaN stored balance equals a NaN derived sum.
      - Both sides of the comparison pass through it: the wallet row through its mapper, and the ledger sum because it is returned as text and parsed back, NaN propagating through addition into the aggregate. ReconcileWallet turns any such refusal into the error record and the divergence count of recon.divergence-handling and re-raises it, so the run ends without a report rather than with a consistent one.
    scenario:
      - As the migrator role, drop the exclusion from the ledger amount and the wallet balance, store a NaN entry and a NaN stored balance for one wallet, restore both constraints NOT VALID, then reconcile that wallet.
    expected:
      - The wallet is never reported consistent; the failure is logged at error level with the walletId and the stored balance is left unchanged.
    evidence: { testId: reconciliation-rejects-non-finite-data, layer: integration }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

