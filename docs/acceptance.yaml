    evidence: { testId: schema-entry-requires-mirroring-wallet, layer: schema }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: SCHEMA-022
    priority: required
    requirement: The ledger of a wallet is one contiguous chain from 0.00 to its head.
    contract: ledger.chain
    enforcement:
      - The entries trigger checks the predecessor (wallet_version - 1, balance_after = balance_before) and the successor (wallet_version + 1, balance_before = balance_after).
    scenario:
      - "By SQL, each with the wallet row updated to match the new entry: an entry whose balance_before differs from the predecessor's balance_after; an entry two versions past the head, leaving a gap; a first entry at version 3; a first entry whose balance_before is not 0.00."
      - 'By SQL, without touching the wallet: an entry at version 1 under the version-2 head of a wallet opened with 0.00; an orphan entry on a wallet with no entries.'
    expected:
      - All six fail at commit with SQLSTATE 23000, naming the link that is broken: the predecessor an entry does not continue, the successor it is not continued by, the first entry of a ledger that does not start at 0.00 at version 1 or 2, or the head no wallet row mirrors.
      - The wallet and its ledger are left as they were.
    evidence: { testId: schema-ledger-chain-continuous, layer: schema }
    deliverySlice: schema-wallet-opening
    implementationStatus: implemented
    verificationStatus: passing

  - id: SCHEMA-023
    priority: required
    requirement: After any committed sequence of direct-SQL writes, balance, ledger sum and ledger head agree.
    contract: [wallet.ledger-mirror, ledger.chain, recon.calculation]
    enforcement:
      - Implied by the two triggers, the arithmetic check, the unique wallet version and ledger immutability; asserted by SQL.
    scenario:
      - 'By SQL: open one wallet with 100.00 and two with 0.00, one of which is never operated; then, from a seeded generator, twelve transactions of one to three credits and debits on a wallet it picks, each transaction mirrored by its last entry.'
      - After every transaction, interleave two refused attempts on the wallet it touched: a balance moved without an entry and an entry appended without the wallet.
    expected:
      - Every generated transaction commits and every interleaved attempt is refused.
      - For every wallet, balance = SUM(credits) - SUM(debits) = balance_after of the entry with the greatest wallet_version, which carries the stored version; the wallet that was never operated has balance 0.00, version 1 and no entries.
