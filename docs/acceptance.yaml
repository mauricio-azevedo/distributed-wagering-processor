      - Inject a failure at the last statement of the financial transaction, before its commit; resend the same request.
    expected:
      - 503 SERVICE_UNAVAILABLE with Retry-After, naming the ceiling it exceeded, and no transaction row, entry or event; the resend is processed as new, not as a replay.
      - The injected pre-commit failure leaves nothing either, and its resend is processed as new; one debit exists in total.
    evidence: { testId: transient-failure-503, layer: integration }
    deliverySlice: atomic-bet
    implementationStatus: implemented
    verificationStatus: passing

