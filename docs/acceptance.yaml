  - id: OUTBOX-003
    priority: required
    requirement: Concurrent publishers drain one outbox without losing a row.
    contract: outbox.concurrent-publishers
    enforcement:
      - PublishOutbox claims a batch with FOR UPDATE SKIP LOCKED and commits the publication markers in the transaction that holds the claim.
    scenario:
      - Enqueue 5000 rows; run two publisher processes until the outbox holds nothing pending.
