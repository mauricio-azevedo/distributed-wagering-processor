# HTTP contract of the wallet and wagering transaction service.
#
# Authoritative for the HTTP transport: paths, parameters, headers, status codes, bodies and
# pagination. Behaviour and business rules live in docs/system-contract.md and are cited below by
# rule id (`area.name`); the queue transport is docs/asyncapi.yaml. A shape change starts here and
# then reaches the DTOs that implement it. Money, identifiers and enumerations are defined
# identically in both contract documents so that each one stands alone.
openapi: 3.1.0
info:
  title: Distributed Wagering Processor HTTP API
  version: 0.1.0
  summary: Player wallets, provider wagering operations, ledger and reconciliation.
  description: |
    The service keeps one wallet per player and currency and applies the operations game providers
    submit against it: `BET`, `WIN`, `LOSS`, `REFUND` and `ROLLBACK`. Every balance change is
    recorded in an immutable ledger and announced through integration events (`docs/asyncapi.yaml`).

    This document is the authoritative HTTP contract. Business rules, failure semantics and
    operational guarantees are specified in `docs/system-contract.md`; the descriptions below cite
    the rule ids they realise.

    ## Conventions

    - **Money** is `{ "amount": "40.00", "currency": "BRL" }`. `amount` is a decimal string with
      exactly two decimals, no sign and at most 18 integer digits; it is never a JSON number
      (`money.decimal-string`, `money.bound`). An operation that moves money carries a strictly
      positive amount; `0.00` is accepted as a wallet's initial balance and as the amount of a
      `LOSS`, which moves none; a negative amount appears only as a reconciliation `difference`
      (`money.signed-difference-only`).
    - **Identifiers.** `walletId` and `transactionId` are lowercase UUIDs minted by the service;
      `playerId` is a UUID minted by the platform. `providerId`, `externalTransactionId`, `roundId`
      and `gameId` are provider identifiers: 1 to 120 characters of `A-Z a-z 0-9 . _ : -`, starting
      with a letter or digit. The provider id `system` is reserved for the internal `OPENING`
      transaction and is refused on submission (`tx.opening-internal`).
    - **Strict input, tolerant output.** A body or parameter that violates this document is
      `400 VALIDATION_FAILED`; unknown members are violations. Response bodies may gain members in
      later versions; clients ignore members they do not know.
    - **Errors.** Request-level errors (`400`, `404`, `409`, `503`) are RFC 9457 problem details with
      a stable `code` and persist nothing (`api.problem-details`, `api.validation-stateless`). A
      business rejection is `422` with a persisted transaction outcome carrying a `failureCode`; a
      `FAILED` transaction replays as `500` with the same outcome body (`tx.failed-semantics`). Both
      code tables, each with the action expected from the caller, are in the system contract
      (sections 9.1 and 9.2).
    - **Correlation.** `X-Correlation-Id` may be sent on any request and is present on every
      response; when absent it is generated (`api.correlation-header`).
    - **Idempotency.** `POST /wagering/transactions` requires `Idempotency-Key`. The same key with
      the same payload replays the stored outcome; the same key with another payload is `409`.
    - **Authentication** is deferred (`auth.deferred`): no request carries credentials in this
      version. `/health/live`, `/health/ready` and `/metrics` stay open whatever the setting
      (`auth.open-endpoints`).
  contact:
    name: Maurício Azevedo
    url: https://github.com/mauricio-azevedo/distributed-wagering-processor
tags:
  - name: Wallets
    description: Wallet opening, reads, ledger pagination and reconciliation.
  - name: Wagering transactions
    description: >-
      Submission and lookup of provider operations. The same use case also runs behind the
      `wager-transactions.fifo` queue described in `docs/asyncapi.yaml`.
  - name: Operations
    description: Liveness, readiness and metrics. Never authenticated.
servers:
  - url: 'http://{host}:{port}'
    description: >-
      An `api` instance. `port` is the `HTTP_PORT` configuration (default 3000); Docker Compose
      publishes the local instance on `localhost`.
    variables:
      host:
        default: localhost
      port:
        default: '3000'
# Authentication is deferred (auth.deferred): no scheme applies to any operation in this version.
security: []
paths:
  /wallets:
    post:
      tags: [Wallets]
      operationId: openWallet
      summary: Open a wallet
      description: |
        Creates the wallet for `playerId` in the currency of `initialBalance` (`api.wallet-create`).
        A positive `initialBalance` is recorded as an internal `OPENING` transaction with its
        `CREDIT` ledger entry in the same database transaction as the wallet
        (`wallet.opening-credit`); `0.00` creates the wallet alone (`wallet.zero-opening`). Either
        way the wallet starts at `version` 1 (`wallet.version-starts-at-one`).

        The `OPENING` transaction is readable at
        `GET /providers/system/wagering/transactions/{walletId}` and emits the processed and
        balance-changed events like any other processed transaction.

        A wallet already existing for the player and currency is `409` and the existing wallet is
        unchanged (`wallet.duplicate-is-conflict`). This endpoint carries no idempotency key:
        repeating a successful call answers `409`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWalletRequest'
            examples:
              funded:
                summary: Opening credit of 500.00 BRL
                value:
                  playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                  initialBalance: { amount: '500.00', currency: BRL }
              empty:
                summary: Wallet without opening credit
                value:
                  playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                  initialBalance: { amount: '0.00', currency: BRL }
      responses:
        '201':
          description: Wallet created. `Location` points at the new wallet.
          headers:
            Location:
              description: Path of the created wallet, `/wallets/{walletId}`.
              required: true
              schema:
                type: string
                format: uri-reference
                examples: [/wallets/01a18261-a600-7589-8768-3d958460eced]
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
              examples:
                funded:
                  summary: Wallet opened with 500.00 BRL
                  value:
                    id: 01a18261-a600-7589-8768-3d958460eced
                    playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                    balance: { amount: '500.00', currency: BRL }
                    version: 1
                    createdAt: '2026-10-28T12:00:00.000Z'
                    updatedAt: '2026-10-28T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/WalletAlreadyExists'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /wallets/{walletId}:
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Read a wallet
      description: >-
        Returns the current balance and version of the wallet (`api.wallet-read`,
        `wallet.read-shape`). The wallet currency is `balance.currency`.
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The wallet.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
              examples:
                afterThreeChanges:
                  summary: Opened with 500.00, a 40.00 bet and a 65.00 win applied
                  value:
                    id: 01a18261-a600-7589-8768-3d958460eced
                    playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                    balance: { amount: '525.00', currency: BRL }
                    version: 3
                    createdAt: '2026-10-28T12:00:00.000Z'
                    updatedAt: '2026-10-28T12:06:00.021Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /wallets/{walletId}/ledger:
    get:
      tags: [Wallets]
      operationId: listWalletLedger
      summary: Page the wallet ledger
      description: |
        Returns ledger entries in ascending `walletVersion` (`api.ledger-read`, `ledger.cursor`).

        Pagination rules:

        - `limit` is 1 to 200, default 50. Omit `cursor` for the first page.
        - The page is `items` plus `nextCursor`. `nextCursor` is `null` on the last page; otherwise
          it is passed unchanged to the next call.
        - The cursor is the unpadded base64url encoding of `v1:<walletVersion of the last returned
          entry>`. It is opaque to clients and stable under concurrent appends: pages never repeat
          or skip an entry, and entries appended after a page was read appear on later pages. A
          well-formed cursor beyond the last entry yields empty `items` and `nextCursor: null`.
        - A cursor that does not decode to that form is `400 INVALID_CURSOR`; restart from the first
          page. A `limit` outside the range or a malformed `walletId` is `400 VALIDATION_FAILED`.
        - `walletVersion` is the only ordering key of a wallet's ledger; `id` identifies an entry
          and never orders (`ledger.wallet-version-sequence`).
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: One page of ledger entries.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
              examples:
                firstPage:
                  summary: '`limit=2` over a ledger with three entries'
                  value:
                    items:
                      - id: 01a18261-a600-758f-9d7a-1c06514cd668
                        walletId: 01a18261-a600-7589-8768-3d958460eced
                        transactionId: 01a18261-a600-758a-aeb0-b30c6f25f3fa
                        kind: OPENING
                        direction: CREDIT
                        money: { amount: '500.00', currency: BRL }
                        balanceBefore: { amount: '0.00', currency: BRL }
                        balanceAfter: { amount: '500.00', currency: BRL }
                        walletVersion: 1
                        createdAt: '2026-10-28T12:00:00.000Z'
                      - id: 01a18266-39ec-7590-ba04-411089f43624
                        walletId: 01a18261-a600-7589-8768-3d958460eced
                        transactionId: 01a18266-39e0-758b-a289-fb48c2dd9c8b
                        kind: BET
                        direction: DEBIT
                        money: { amount: '40.00', currency: BRL }
                        balanceBefore: { amount: '500.00', currency: BRL }
                        balanceAfter: { amount: '460.00', currency: BRL }
                        walletVersion: 2
                        createdAt: '2026-10-28T12:05:00.012Z'
                    nextCursor: djE6Mg
                lastPage:
                  summary: The page after `cursor=djE6Mg`
                  value:
                    items:
                      - id: 01a18267-2455-7591-998c-e5d21ba7006a
                        walletId: 01a18261-a600-7589-8768-3d958460eced
                        transactionId: 01a18267-2440-758c-b6af-c1ec0229822d
                        kind: WIN
                        direction: CREDIT
                        money: { amount: '65.00', currency: BRL }
                        balanceBefore: { amount: '460.00', currency: BRL }
                        balanceAfter: { amount: '525.00', currency: BRL }
                        walletVersion: 3
                        createdAt: '2026-10-28T12:06:00.021Z'
                    nextCursor: null
        '400':
          $ref: '#/components/responses/LedgerBadRequest'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /wallets/{walletId}/reconciliation:
    post:
      tags: [Wallets]
      operationId: reconcileWallet
      summary: Reconcile a wallet against its ledger
      description: |
        Compares the stored balance with the balance rebuilt from the ledger (`api.reconciliation`,
        `recon.calculation`). Both readings come from one `REPEATABLE READ` snapshot taken without
        locking the wallet, so processing is never blocked (`recon.snapshot`).

        `200` is returned whether or not the wallet is consistent. A divergence is reported with
        `consistent: false`, logged, counted in `wager_reconciliation_divergence_total` and never
        corrected (`recon.divergence-handling`). The request has no body.
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The reconciliation report.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'
              examples:
                consistent:
                  summary: Stored balance equals the ledger
                  value:
                    walletId: 01a18261-a600-7589-8768-3d958460eced
                    storedBalance: { amount: '525.00', currency: BRL }
                    calculatedBalance: { amount: '525.00', currency: BRL }
                    difference: { amount: '0.00', currency: BRL }
                    consistent: true
                    checkedEntries: 3
                    checkedAt: '2026-10-28T12:10:00.000Z'
                divergent:
                  summary: Stored balance below the ledger by 40.00
                  value:
                    walletId: 01a18261-a600-7589-8768-3d958460eced
                    storedBalance: { amount: '485.00', currency: BRL }
                    calculatedBalance: { amount: '525.00', currency: BRL }
                    difference: { amount: '-40.00', currency: BRL }
                    consistent: false
                    checkedEntries: 3
                    checkedAt: '2026-10-28T12:10:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /wagering/transactions:
    post:
      tags: [Wagering transactions]
      operationId: submitWagerTransaction
      summary: Submit a provider operation
      description: |
        Applies one provider operation to a wallet, or replays its stored outcome. This endpoint and
        the `wager-transactions.fifo` queue run the same use case (`msg.same-use-case`), so every
        rule below holds on both entry points.

        Idempotency (`idem.*`):

        - `Idempotency-Key` is mandatory; the recommended value is
          `{providerId}:{externalTransactionId}`, which always fits the 255-character limit.
        - Keys are scoped per `providerId`. The same key with the same payload hash replays the
          stored outcome with `idempotentReplay: true` and the status the outcome maps to; a
          `PENDING_REFERENCE` transaction replays as `202` until it becomes terminal, and a terminal
          one replays its frozen status, failure code and observed balance forever
          (`idem.replay-follows-persisted-outcome`). A replay touches nothing and emits no event.
        - The same key with another payload is `409 IDEMPOTENCY_PAYLOAD_MISMATCH`; a different key
          for an existing `(providerId, externalTransactionId)` is
          `409 EXTERNAL_TRANSACTION_ALREADY_BOUND`. Neither persists anything.
        - The payload hash is `sha256:` plus the lowercase hex SHA-256 of the RFC 8785 canonical JSON
          of the request body: the business fields with `money` nested and
          `referenceExternalTransactionId` omitted when absent. Headers never enter it
          (`idem.payload-hash`).

        Outcome to status (`api.status-classes`):

        | Outcome | Status | Body |
        | --- | --- | --- |
        | `PROCESSED`, first time or replay | `200` | Outcome |
        | `PENDING_REFERENCE`, first time or replay | `202` plus `Location` | Outcome |
        | `REJECTED`, first time or replay | `422` | Outcome with `failureCode` |
        | `FAILED`, replay only | `500` | Outcome with `failureCode` |
        | Malformed body, missing or malformed key, kind `OPENING`, provider `system`, reference against the kind matrix, self-reference | `400` | Problem |
        | Unknown wallet | `404` | Problem |
        | Key reused with another payload; external id bound to another key | `409` | Problem |
        | Dependency unavailable or lock timeout | `503` plus `Retry-After` | Problem |

        A `422` is persisted: the transaction row exists as `REJECTED`, is readable through the
        lookup endpoints and changes no balance, ledger entry or version (`rule.rejected.no-effect`).
        `FAILED` is never produced by a submission itself; it is reached by the pending-reference
        scheduler after a permanent infrastructure error (`tx.failed-semantics`) and appears here
        only as the `500` replay of such a transaction: the request is correct, resending changes
        nothing, and the caller contacts operations with the transaction id.

        Reference rules (`rule.reference.*`): a reference is resolved by
        `(providerId, referenceExternalTransactionId)`; a target that does not exist yet, or is not
        terminal, parks the transaction as `PENDING_REFERENCE` for up to 60 minutes
        (`ref.ttl`), after which it is `REJECTED` with `REFERENCE_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWagerTransactionRequest'
            examples:
              bet:
                summary: '`BET` debiting 40.00'
                value:
                  providerId: provider-acme
                  externalTransactionId: acme-tx-000123
                  playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                  walletId: 01a18261-a600-7589-8768-3d958460eced
                  roundId: round-7f3a
                  gameId: lucky-sevens
                  kind: BET
                  money: { amount: '40.00', currency: BRL }
              winReferencingBet:
                summary: "`WIN` crediting 65.00, referencing the round's bet"
                value:
                  providerId: provider-acme
                  externalTransactionId: acme-tx-000124
                  playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                  walletId: 01a18261-a600-7589-8768-3d958460eced
                  roundId: round-7f3a
                  gameId: lucky-sevens
                  kind: WIN
                  money: { amount: '65.00', currency: BRL }
                  referenceExternalTransactionId: acme-tx-000123
              loss:
                summary: '`LOSS` recording the outcome without moving money'
                value:
                  providerId: provider-acme
                  externalTransactionId: acme-tx-000127
                  playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                  walletId: 01a18261-a600-7589-8768-3d958460eced
                  roundId: round-7f3b
                  gameId: lucky-sevens
                  kind: LOSS
                  money: { amount: '10.00', currency: BRL }
              refund:
                summary: '`REFUND` returning the referenced bet; the amount must equal the bet'
                value:
                  providerId: provider-acme
                  externalTransactionId: acme-tx-000128
                  playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                  walletId: 01a18261-a600-7589-8768-3d958460eced
                  roundId: round-7f3a
                  gameId: lucky-sevens
                  kind: REFUND
                  money: { amount: '40.00', currency: BRL }
                  referenceExternalTransactionId: acme-tx-000123
              rollbackBeforeReference:
                summary: '`ROLLBACK` whose reference has not arrived yet; parked as `PENDING_REFERENCE`'
                value:
                  providerId: provider-acme
                  externalTransactionId: acme-tx-000126
                  playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                  walletId: 01a18261-a600-7589-8768-3d958460eced
                  roundId: round-7f3a
                  gameId: lucky-sevens
                  kind: ROLLBACK
                  money: { amount: '25.00', currency: BRL }
                  referenceExternalTransactionId: acme-tx-000999
      responses:
        '200':
          description: >-
            The transaction is `PROCESSED`: applied now, or replayed from a stored `PROCESSED`
            outcome. `balance` is the balance observed when the outcome was recorded
            (`tx.observed-balance`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessedOutcome'
              examples:
                applied:
                  summary: Bet applied now
                  value:
                    transactionId: 01a18266-39e0-758b-a289-fb48c2dd9c8b
                    status: PROCESSED
                    balance: { amount: '460.00', currency: BRL }
                    idempotentReplay: false
                replayed:
                  summary: The same bet submitted again, after other operations moved the balance
                  value:
                    transactionId: 01a18266-39e0-758b-a289-fb48c2dd9c8b
                    status: PROCESSED
                    balance: { amount: '460.00', currency: BRL }
                    idempotentReplay: true
        '202':
          description: >-
            The transaction is `PENDING_REFERENCE`: persisted and waiting for its reference
            (`ref.parked-state`), first time or replay. `Location` points at the transaction
            (`api.location-on-pending`); poll it, or consume the integration events.
          headers:
            Location:
              description: Path of the transaction, `/wagering/transactions/{transactionId}`.
              required: true
              schema:
                type: string
                format: uri-reference
                examples: [/wagering/transactions/01a18268-f900-758e-8c3e-13ce27511119]
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingReferenceOutcome'
              examples:
                parked:
                  summary: Rollback parked until its reference arrives
                  value:
                    transactionId: 01a18268-f900-758e-8c3e-13ce27511119
                    status: PENDING_REFERENCE
                    balance: { amount: '525.00', currency: BRL }
                    idempotentReplay: false
        '400':
          $ref: '#/components/responses/SubmissionBadRequest'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: >-
            The transaction is `REJECTED` by a business rule, first time or replay. The outcome is
            persisted and carries exactly one `failureCode` (`failure.stable-codes`); the system
            contract lists the action expected for each code. Balance, ledger and version are
            unchanged (`rule.rejected.no-effect`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectedOutcome'
              examples:
                insufficientBalance:
                  summary: A 600.00 bet against a 525.00 balance
                  value:
                    transactionId: 01a18268-0ea0-758d-9828-d2f91413b8b3
                    status: REJECTED
                    balance: { amount: '525.00', currency: BRL }
                    idempotentReplay: false
                    failureCode: INSUFFICIENT_BALANCE
        '500':
          description: >-
            Replay of a transaction the pending-reference scheduler marked `FAILED` after a
            permanent infrastructure error (`tx.failed-semantics`, `ref.permanent-failure`). The
            body is the persisted outcome, not a problem: the request is correct and resending it
            changes nothing; contact operations with the transaction id. A first submission never
            answers `500`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedOutcome'
              examples:
                failedReplay:
                  summary: Replay of a transaction the scheduler marked `FAILED`
                  value:
                    transactionId: 01a18269-e360-7598-9c0e-5b7d2e4f1a63
                    status: FAILED
                    balance: { amount: '525.00', currency: BRL }
                    idempotentReplay: true
                    failureCode: PROCESSING_FAILED
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /wagering/transactions/{transactionId}:
    get:
      tags: [Wagering transactions]
      operationId: getWagerTransaction
      summary: Read a transaction by service id
      description: >-
        Returns the full transaction view (`api.transaction-read`, `tx.read-shape`), including
        `REJECTED` and `FAILED` transactions for audit. Internal `OPENING` transactions are
        returned like any other.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The transaction.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WagerTransaction'
              examples:
                processedBet:
                  summary: A processed bet
                  value:
                    transactionId: 01a18266-39e0-758b-a289-fb48c2dd9c8b
                    providerId: provider-acme
                    externalTransactionId: acme-tx-000123
                    idempotencyKey: provider-acme:acme-tx-000123
                    payloadHash: sha256:2bba54ed2c9b88952dc90ee0d38bd41bee09fef0fcf7ab87e47e67d8be05bfa9
                    walletId: 01a18261-a600-7589-8768-3d958460eced
                    playerId: 01a17cb1-f5c0-7588-9a61-47a9444c049e
                    roundId: round-7f3a
                    gameId: lucky-sevens
                    kind: BET
